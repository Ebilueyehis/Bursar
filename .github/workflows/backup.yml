name: Nightly backup

# 02:00 UTC is 03:00 in Lagos, comfortably after a school day.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # pg_dump must not be older than the server (Postgres 17), and the
          # runner ships an older client, so dump from the matching image.
          docker run --rm -e DB_URL -v "$PWD:/out" postgres:17-alpine \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges --file=/out/bursar.dump "$DB_URL"'
          test -s bursar.dump

      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age

      - name: Encrypt the dump
        env:
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          # RECIPIENT is a public key. This job can write backups and cannot
          # read any of them back, including the one it just wrote.
          age --recipient "$RECIPIENT" --output bursar.dump.age bursar.dump
          rm -f bursar.dump
          test -s bursar.dump.age

      - name: Upload to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          # Belt and braces: some AWS CLI builds send checksum headers B2 has
          # only supported since mid-2025, and at least one CLI version keeps
          # sending them even with this set. Cheap to leave in either way.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: ${{ secrets.B2_BUCKET }}
          REGION: ${{ secrets.B2_REGION }}
        run: |
          set -euo pipefail
          ENDPOINT="https://s3.${REGION}.backblazeb2.com"
          DAY=$(date -u +%Y-%m-%d)
          aws s3 cp bursar.dump.age "s3://${BUCKET}/daily/bursar-${DAY}.dump.age" \
            --endpoint-url "$ENDPOINT"
          # Keep one copy per month. Retention itself is a B2 lifecycle rule,
          # not job logic, so it keeps working even if this workflow breaks.
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp bursar.dump.age "s3://${BUCKET}/monthly/bursar-${DAY}.dump.age" \
              --endpoint-url "$ENDPOINT"
          fi
          rm -f bursar.dump.age

      - name: Keep the project awake
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Free Supabase projects pause after seven days without API activity.
          # A school on holiday is exactly that.
          #
          # This does NOT query a table. Every RLS policy in schema.sql calls
          # auth_school_id()/auth_role(), and EXECUTE on those is granted only
          # to `authenticated`, never `anon` — so an anon-only request against
          # any RLS-protected table fails RLS evaluation itself with
          # "permission denied for function auth_school_id" (42501), not the
          # empty result this step actually wants. That is correct behaviour
          # for the security boundary (anon truly cannot read school data,
          # it cannot even ask the question), but it means this step has to
          # touch the project without touching a table. The Auth service's
          # health endpoint does exactly that: no RLS, no table grant, still
          # real API traffic against the project.
          curl -fsS "${URL}/auth/v1/health" -H "apikey: ${ANON}" -o /dev/null
